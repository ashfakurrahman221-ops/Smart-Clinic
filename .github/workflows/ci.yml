name: Smart Clinic CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-tests:
    name: Backend Unit Tests & Migrations (Django 5)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./clinic_backend

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify Migrations
        run: |
          python manage.py migrate --check

      - name: Run Test Suite
        run: |
          python manage.py test

  frontend-build:
    name: Frontend Production Build (React 19 + Vite 8)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./smart-clinic

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: ./smart-clinic/package-lock.json

      - name: Install NPM Packages
        run: npm ci

      - name: Build Production Bundle
        run: npm run build